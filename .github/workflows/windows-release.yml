name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run prepare-runtime
      - run: npx tauri build
      - run: npm run verify-package -InstallerPath (Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1).FullName
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: iBM-Lab-Agent-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
