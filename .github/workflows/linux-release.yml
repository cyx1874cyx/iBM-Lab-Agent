name: Linux release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Validate shell entry points
        run: |
          bash -n install.sh
          bash -n bin/ibm-lab-agent
          bash -n runtime/install-ubuntu.sh
          bash -n scripts/build-linux-release.sh

      - name: Install the pinned DSH test runtime
        run: |
          npm install --global pnpm@10.34.5 --no-audit --no-fund
          pnpm --dir runtime/launcher install --prod --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/runtime/launcher/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install plugin dependencies
        run: npm ci --omit=peer --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Link the DSH host surface
        env:
          DSH_HARNESS_NODE_MODULES: ${{ github.workspace }}/runtime/launcher/node_modules
        run: node scripts/dev-link.mjs

      - name: Test
        env:
          DSH_HARNESS_NODE_MODULES: ${{ github.workspace }}/runtime/launcher/node_modules
        run: |
          npm run test:all
          npm run regression

      - name: Build Linux archive
        run: bash scripts/build-linux-release.sh HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ibm-lab-agent-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "iBM Lab Agent $TAG" --generate-notes
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
