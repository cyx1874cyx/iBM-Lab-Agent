# dsh-lab-agent python requirements lock
# 来源：nature-skills .github/requirements-ci.txt（上游 CI 固定环境，Python 3.11）
# 由 scripts/pin-vendor.mjs 记录 sha256 到 vendor.lock.json；升级依赖需手动重生成
# 生成日期：2026-08-17
# 更新：2026-09-02 在干净 Python 3.11 中解析新增 origin-mcp==0.1.4（不含
# [origin] extra，即不引入 originpro/pywin32）；pandas/openpyxl/xlrd 及其
# 传递依赖（numpy/python-dateutil/six/tzdata/et_xmlfile）版本一并固定。
# 原有 mcp==1.29.0 / pydantic==2.13.4 满足 origin-mcp 约束（mcp>=1.8.0、
# pydantic>=2.0），保持固定版本不变。
# 更新：2026-09-02（0.2.0）追加 mnova-mcp 0.3.1 与 NMR skill 运行依赖：
#   - mnova-mcp 本体由构建脚本从 vendor/mnova-mcp 构建 wheel 后 --no-deps
#     安装（不进此 lock；其运行时约束 filelock>=3.15,<4 / mcp>=1.28,<2 /
#     pydantic>=2.7,<3 均已被本文件满足）；
#   - NMR skill 脚本（process_1d.py / simulate_1d.py）运行需要 scipy /
#     matplotlib / nmrglue（nmrglue 用于读取 Bruker/Varian FID），与其
#     传递依赖（contourpy/cycler/fonttools/kiwisolver/pyparsing）一并固定。
# 解析环境：Windows Python 3.11.9 干净 venv，PyPI 清华镜像，全部 import
# 自检通过（scipy 1.17.1 / matplotlib 3.11.1 / nmrglue 0.12 / filelock 3.32.5）。
# 更新：2026-09-04（0.3.1-rc.1，P1 修复 #3）追加 PyMuPDF==1.28.2：prepare_paper.py
# 的 PDF 输入依赖 fitz，此前仅 python/requirements-linux.lock 含 PyMuPDF，导致
# Windows venv / bundled python 无法登记 PDF 原文。版本与 linux 锁保持一致。
#
# 更新：2026-09-25（0.5.4）Windows 捆绑解释器 3.11.9 -> 3.12.10，与 Linux 线
# runtime/versions.env 的 PYTHON_VERSION=3.12.11 对齐（两条线此前一 3.11 一 3.12）。
# 本轮**不重新解析**：逐包核对过 cp312 wheel 可用性后原样保留全部版本 pin
# （numpy/pandas/scipy/matplotlib/Pillow/lxml/cffi/PyYAML/pydantic-core/rpds-py
# 均有 cp312-win_amd64；cryptography 走 cp39-abi3、PyMuPDF 走 cp310-abi3、
# pypdfium2 走 py3-none-win_amd64，均覆盖 3.12），避免版本漂移扩大重验证面。
# 同批新增 pptx-cli==1.3.5 及其闭包（见文件末尾分组）：它是模板 manifest 的读取方，
# 而 pptx-cli 要求 Python >=3.12 —— 这就是本次解释器升级的直接动因。
# 注意：本文件基准自此**有意**偏离 nature-skills 上游 CI（仍为 3.11）。
#
# Reproducible Python 3.12 environment (Windows bundle + CLI venv).
# Keep user-facing skill requirements flexible; update this file deliberately
# after validating a fresh resolver result in CI.
