<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iBM Lab Agent</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #101827; color: #e7edf7; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: #101827; }
    .shell { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: #162136; border-bottom: 1px solid #26334d; }
    .brand { font-weight: 650; letter-spacing: .2px; white-space: nowrap; } .state { color: #9fb1ca; font-size: 13px; flex: 1; }
    button { border: 1px solid #405675; background: #203451; color: #ecf3fb; padding: 7px 11px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #29466c; } .workspace { position: relative; min-height: 0; }
    #app { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: white; display: none; }
    #splash { max-width: 640px; margin: 13vh auto; padding: 32px; text-align: center; }
    .spinner { margin: 0 auto 22px; width: 34px; height: 34px; border: 3px solid #344b70; border-top-color: #72b4ff; border-radius: 50%; animation: spin 1s linear infinite; }
    .title { font-size: 21px; font-weight: 600; } .detail { margin: 12px 0 20px; color: #9fb1ca; line-height: 1.6; }
    #error-actions, #settings { display: none; } #settings { max-width: 560px; margin: 18px auto; text-align: left; }
    label { display: block; margin: 14px 0 5px; color: #bfd0e6; font-size: 13px; }
    input { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #3c5375; background: #0d1625; color: #eef5ff; }
    .hint { font-size: 12px; color: #8ea2bd; margin-top: 12px; line-height: 1.55; }
    /* P1-1 runtime dependency doctor：诊断覆盖层，一屏展示 Edge/Python/Bridge/Office 状态 */
    #diagnostics { position: absolute; inset: 0; z-index: 10; overflow: auto; background: #101827; padding: 22px 26px 40px; display: none; }
    #diagnostics .diag-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    #diagnostics h2 { font-size: 17px; font-weight: 650; margin: 0; }
    #diagnostics .diag-sub { color: #8ea2bd; font-size: 13px; margin: 0 0 16px; }
    table.deps-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #0d1625; border-radius: 8px; overflow: hidden; }
    .deps-table th { text-align: left; color: #9fb1ca; font-weight: 600; padding: 10px 14px; border-bottom: 1px solid #26334d; background: #162136; }
    .deps-table td { padding: 11px 14px; border-bottom: 1px solid #1c2940; vertical-align: top; line-height: 1.5; }
    .deps-table tr:last-child td { border-bottom: 0; }
    .dep-label { font-weight: 600; color: #e7edf7; }
    .dep-detail { color: #c6d3e6; word-break: break-all; }
    .dep-hint { color: #8ea2bd; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-ok { background: rgba(47, 158, 110, .16); color: #4fc08d; border: 1px solid rgba(47, 158, 110, .45); }
    .badge-warning { background: rgba(217, 161, 61, .16); color: #e3b34e; border: 1px solid rgba(217, 161, 61, .45); }
    .badge-missing { background: rgba(217, 83, 79, .16); color: #e0706c; border: 1px solid rgba(217, 83, 79, .45); }
    #bridge-detail { margin-top: 14px; padding: 12px 14px; background: #0d1625; border: 1px solid #1c2940; border-radius: 8px; font-size: 12px; color: #8ea2bd; line-height: 1.7; }
    #bridge-detail code { color: #c6d3e6; word-break: break-all; }
    .diag-actions { display: flex; gap: 10px; margin: 16px 0 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <span class="brand">iBM Lab Agent</span><span class="state" id="state">正在准备本地科研工作台…</span>
      <button id="settings-button" type="button">设置</button><button id="logs-button" type="button">日志</button><button id="deps-button" type="button">诊断</button>
    </nav>
    <section class="workspace">
      <iframe id="app" title="iBM Lab Agent 本地工作台"></iframe>
      <!-- P1-1 runtime dependency doctor：覆盖层，一屏展示依赖状态 -->
      <section id="diagnostics">
        <div class="diag-head"><h2>运行时依赖诊断</h2><span class="state" id="diag-state">加载中…</span></div>
        <p class="diag-sub">检测 Edge / Python / Bridge / Office 等运行时依赖；检测只读，不会修改系统。</p>
        <div class="diag-actions">
          <button id="diag-refresh" type="button">重新检测</button>
          <button id="diag-close" type="button">关闭</button>
        </div>
        <table class="deps-table">
          <thead><tr><th style="width:180px">依赖</th><th style="width:88px">状态</th><th>详情</th><th>建议</th></tr></thead>
          <tbody id="deps-body"></tbody>
        </table>
        <div id="bridge-detail" style="display:none"></div>
      </section>
      <section id="splash">
        <div class="spinner" id="spinner"></div><div class="title" id="title">正在启动 iBM Lab Agent</div>
        <p class="detail" id="detail">首次启动会准备内置运行环境；这不会打开浏览器，也不会连接公网。</p>
        <div id="error-actions"><button id="retry-button" type="button">重试启动</button></div>
        <form id="settings" autocomplete="off">
          <label for="api-key">API Key</label><input id="api-key" type="password" placeholder="可选：留空则沿用 DSH 已有设置">
          <label for="base-url">接口地址</label><input id="base-url" type="url" placeholder="可选">
          <label for="model">模型</label><input id="model" type="text" placeholder="可选">
          <label for="workspace-path">工作目录</label><input id="workspace-path" type="text" placeholder="可选">
          <p class="hint">设置仅保存在当前 Windows 用户的本地应用目录，界面和日志不会显示 API Key。保存后请重新启动运行环境使其生效。</p>
          <button type="submit">保存设置</button>
        </form>
      </section>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const invoke = (command, args = {}) => window.__TAURI_INTERNALS__.invoke(command, args);
    const splash = $('splash'), frame = $('app'), settings = $('settings'), diagnostics = $('diagnostics');
    // P1-1：状态徽章映射（ok=绿 / warning=黄 / missing=红，暗色主题）
    const DEP_STATES = {
      ok: { text: '正常', badge: 'badge-ok' },
      warning: { text: '警告', badge: 'badge-warning' },
      missing: { text: '缺失', badge: 'badge-missing' },
    };
    const esc = (value) => String(value ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    async function showDiagnostics() {
      diagnostics.style.display = diagnostics.style.display === 'block' ? 'none' : 'block';
      if (diagnostics.style.display !== 'block') return;
      await refreshDiagnostics();
    }
    async function refreshDiagnostics() {
      const body = $('deps-body'), bridgeDetail = $('bridge-detail');
      $('diag-state').textContent = '检测中…';
      body.innerHTML = '<tr><td colspan="4" style="color:#8ea2bd">正在检测运行时依赖…</td></tr>';
      bridgeDetail.style.display = 'none';
      try {
        const deps = await invoke('runtime_deps');
        body.innerHTML = deps.items.map((item) => {
          const state = DEP_STATES[item.state] || DEP_STATES.missing;
          return `<tr>
            <td class="dep-label">${esc(item.label)}</td>
            <td><span class="badge ${state.badge}">${state.text}</span></td>
            <td class="dep-detail">${esc(item.detail)}</td>
            <td class="dep-hint">${esc(item.hint)}</td>
          </tr>`;
        }).join('');
        const counts = deps.items.reduce((acc, item) => { acc[item.state] = (acc[item.state] || 0) + 1; return acc; }, {});
        const summary = ['ok', 'warning', 'missing'].filter((k) => counts[k]).map((k) => `${DEP_STATES[k].text} ${counts[k]} 项`).join('，');
        $('diag-state').textContent = `检测完成：${summary}`;
        const bridge = deps.bridge || {};
        bridgeDetail.style.display = 'block';
        bridgeDetail.innerHTML = `Native Messaging 桥详情：
          <br>扩展 ID：<code>${esc(bridge.extensionId || '-')}</code>（注册：${bridge.registered ? '是' : '否'}，origins 一致：${bridge.originsMatch ? '是' : '否'}）
          <br>manifest：<code>${esc(bridge.manifestPath || '未生成')}</code>
          <br>wrapper：<code>${esc(bridge.wrapperPath || '未生成')}</code>
          <br>host.js 存在：${bridge.hostJsExists ? '是' : '否'}；node.exe 存在：${bridge.nodeExeExists ? '是' : '否'}`;
      } catch (error) {
        body.innerHTML = `<tr><td colspan="4" style="color:#e0706c">检测失败：${esc(error)}。请查看日志。</td></tr>`;
        $('diag-state').textContent = '检测失败';
      }
    }
    function setText(id, value) { $(id).textContent = value; }
    async function showSettings() {
      settings.style.display = settings.style.display === 'block' ? 'none' : 'block';
      if (settings.style.display !== 'block') return;
      try {
        const config = await invoke('load_config');
        $('api-key').value = config.apiKey || ''; $('base-url').value = config.baseUrl || '';
        $('model').value = config.model || ''; $('workspace-path').value = config.workspace || '';
      } catch (error) { setText('detail', `无法读取设置：${error}`); }
    }
    window.ibmLabRuntimeStarting = () => {
      frame.style.display = 'none'; splash.style.display = 'block'; $('spinner').style.display = 'block';
      $('error-actions').style.display = 'none'; setText('title', '正在启动 iBM Lab Agent'); setText('detail', '正在选择本地端口并检查服务状态…'); setText('state', '本地服务启动中');
    };
    window.ibmLabRuntimeReady = (url) => {
      frame.src = url; frame.style.display = 'block'; splash.style.display = 'none'; setText('state', `本地服务已就绪：${url}`);
    };
    window.ibmLabRuntimeFailed = (message) => {
      frame.style.display = 'none'; splash.style.display = 'block'; $('spinner').style.display = 'none'; $('error-actions').style.display = 'block';
      setText('title', '本地服务未能启动'); setText('detail', `${message}。可查看日志或修改设置后重试。`); setText('state', '启动失败');
    };
    $('retry-button').addEventListener('click', () => invoke('restart_runtime').catch(window.ibmLabRuntimeFailed));
    $('logs-button').addEventListener('click', () => invoke('open_logs').catch(window.ibmLabRuntimeFailed));
    $('settings-button').addEventListener('click', showSettings);
    $('deps-button').addEventListener('click', showDiagnostics);
    $('diag-refresh').addEventListener('click', refreshDiagnostics);
    $('diag-close').addEventListener('click', () => { diagnostics.style.display = 'none'; });
    settings.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await invoke('save_config', { config: { apiKey: $('api-key').value, baseUrl: $('base-url').value, model: $('model').value, workspace: $('workspace-path').value } });
        setText('detail', '设置已保存。点击“重试启动”将重新启动本地服务。');
      } catch (error) { setText('detail', `无法保存设置：${error}`); }
    });
    // desktop-edge-handoff：来自工作台 iframe 的捕获请求桥。iframe 内看不到
    // __TAURI_INTERNALS__，因此由本 shell 接收 OPEN_IN_EDGE 并调用 Tauri 命令；
    // 结果回传给 iframe，超时/失败同样回传（iframe 侧 4s 超时兜底）。
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || data.source !== 'ibm-lab-agent' || data.type !== 'OPEN_IN_EDGE' || !data.requestId) return;
      const reply = (payload) => {
        try { (event.source || window).postMessage({ source: 'ibm-lab-agent-shell', type: 'OPEN_IN_EDGE_RESULT', requestId: data.requestId, payload }, '*'); }
        catch { /* iframe 已卸载时忽略 */ }
      };
      invoke('open_in_edge', { url: String(data.url || '') })
        .then(() => reply({ ok: true }))
        .catch((error) => reply({ ok: false, error: String(error) }));
    });
  </script>
</body>
</html>
