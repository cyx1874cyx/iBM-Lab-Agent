[package]
name = "ibm-lab-desktop"
version = "0.1.6"
description = "iBM Lab Agent Windows desktop client"
authors = ["iBM Lab"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
