# Generated from the full compatibility composition; run compose-domain-bundles.mjs.
# Domain: literature; required compositions: core, runtime, documents.
- insert:
    - id: ibm-literature-workflows
      name: 'dsh-lab-agent/workflows'
      inject: [ibmCore, ibmRuntime, ibmDocuments, labGoals, labTemplates, labNoteTemplates]
      config:
        skillsRoot: !!js dshHomePath('lab-agent/vendor/nature-skills/skills')
        venvDir: !!js dshHomePath('lab-agent/.venv')
    - id: ibm-literature-remote
      name: 'dsh-lab-agent/literature-remote'
    - id: lab-goal-profiles
      name: 'dsh-lab-agent/goal-profiles'
      inject: [storageDomain]

    # ── Reading-note templates (NoteTemplate) ─────────────────────────────────
    #
    # Host service `ctx.labNoteTemplates`: 可保存/复制/修改/版本化的「阅读笔记
    # 模板」。版本行不可变（id@version），删除只归档，历史版本与任务快照始终可读。
    # 主面板「模板管理」用它管理阅读笔记模板，Agent 生成阅读笔记时按模板生成
    # （toNoteRequirements → 章节/风格/证据/输出要求）。
    - id: lab-literature-sources
      name: 'dsh-lab-agent/literature-sources'
      inject: [storageDomain, webServer]
      config:
        sessionsDir: !!js dshHomePath('lab-agent/literature-sessions')
        downloadsDir: !!js dshHomePath('lab-agent/literature-downloads')
        institutionPortalUrl: 'https://lib.ustc.edu.cn/'
        # 浏览器模式（browserMode）**刻意不在此处配置**，由运行期能力探测决定，
        # 单一真源是 lib/capabilities.js 的 defaultBrowserMode()：
        #   桌面封装环境 → desktop-edge-handoff
        #       （外部 Edge 承担登录/下载，PDF/SI 经 capture handoff + 扩展 +
        #        Native Messaging 回传；该链只在桌面端存在）
        #   其它形态    → web-current
        #       （Linux 服务端/纯 Web 没有那条回传链；若落到 managed-edge 会去
        #        启动一个不存在的 Edge）
        # 判据是 IBM_LAB_AGENT_BUNDLED_PYTHON：Tauri 启动 DSH 子进程时设置
        # （desktop/src-tauri/src/runtime/process.rs:208），也是本仓库既有的桌面环境
        # 判据（dsh.rs 生成 MCP patch 同用）。不能用 IBM_LAB_AGENT_WORKSPACE，
        # bin/ibm-lab-agent:23 会把它默认成 $HOME，Linux 形态也为真。
        #
        # 为什么不在 YAML 里写 !!js 三元表达式：YAML 的 "? " 是复杂映射键指示符，
        # `!!js cond ? 'a' : 'b'` 会被解析成映射对象 { '[object Object]': 'b' } 而
        # 不是标量，静默传错值（本项目实测踩过）。简单表达式（无 ? :）才可裸写，
        # 如上面的 dshHomePath(...) 与 dsh.rs 的 process.env[...]。
        # 需要三种模式时可显式配置 browserMode；显式值仍优先（见 resolveBrowserMode）。
        # clientManagedBrowser（旧布尔）同理保持未配置，避免旧分支遮蔽探测。
        # 该行为由 tests/unit/capabilities.test.mjs 用**真实加载器解析**后断言。

    # ── Office 产物二进制下载 ─────────────────────────────────────────────
    # DOCX/PPTX 走同源 HTTP 二进制流并附带长度/SHA-256，避免大型 base64 经
    # Remote JSON 边界截断后在 Windows 被识别为损坏文件。
    - id: lab-capture
      name: 'dsh-lab-agent/manual-capture'
      inject: [storageDomain, labTasks, webServer]

    # ── Ketcher standalone 静态资源（labKetcherAssets，0.3.2）─────────────
    #
    # Host service `ctx.labKetcherAssets`：把预构建的 Ketcher standalone 应用
    # （client/assets/ketcher-standalone，vite 一次构建产物，自包含 worker/wasm）
    # 以 /api/lab-ketcher/* 同源托管。前端「合成路线工作台」用 iframe 打开
    # 编辑器弹层（加载/保存 SMILES 经 postMessage 通信），条件区化合物按名称
    # 匹配 route.compounds / step.structures 显示结构式。
    - id: lab-capture-handoff
      name: 'dsh-lab-agent/capture-handoff'
      inject: [labCapture, webServer]

    # ── Lab remote bridge（项目工作台用）──────────────────────────────────
    #
    # Host service `ctx.lab` 把项目核心记忆、三类项目成果及底层能力经
    # api-gateway 暴露给 Web client。放在全部依赖服务之后，避免部分启动。
