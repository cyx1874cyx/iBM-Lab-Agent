# dsh-lab-agent bundle patch: the lab research agent over the dsh web surface.
#
# Applied after dsh-web-app's patch layer (and after dsh-base). Rows here
# override base rows by id and register NEW rows via `insert`. The profile's
# own cordis.patch.yml and any --patch overlays still come after this layer.
#
# Scope decisions (see dsh-web-app/cordis.patch.yml comments):
#   * The `skills` REGISTRY stays host-plane and is layered per scope. A host
#     row here registers into the GLOBAL layer, so every agent (including the
#     shipped `standard` preset's `tool-skill` loader) sees the merged catalog.
#   * Services are host-plane because the api gateway and cold transcript reads
#     resolve them process-wide; nothing here mounts a model-facing tool yet
#     (task interfaces arrive in Phase 2+ and mount behind the lab preset).

# ── Nature Skills discovery (global skill layer) ─────────────────────────────
#
# A dedicated filesystem provider instance that sees ONLY the pinned
# nature-skills tree: `includeDefaultRoots: false` drops the project/user
# roots so this provider is isolated to its own custom root and cannot be
# confused with the per-preset discovery provider.
#
# The root is the deployment data dir `$DSH_HOME/lab-agent/vendor/nature-skills`
# (materialized by scripts/install.mjs from the repo's pinned vendor tree).
# `dshHomePath` is the loader expression helper resolving `$DSH_HOME`.
- insert:
    - id: lab-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: lab-nature
        includeDefaultRoots: false
        customSkillDirs:
          - !!js dshHomePath('lab-agent/vendor/nature-skills/skills')

    # ── Nature Skill version registry (NatureSkillVersion) ────────────────────
    #
    # Host service `ctx.labVersions`: durable registry of pinned Nature Skills
    # (repo commit, manifest version, license, python lock hash, regression
    # date). Persists through the storage-domain layer (JSON backend). Reads
    # are available to every agent; writes go through explicit registration /
    # bootstrap calls (install script, upgrade tool) so a model never mutates
    # the lock silently.
    - id: lab-version-registry
      name: 'dsh-lab-agent/version-registry'
      inject: [storageDomain]
      config:
        vendorDir: !!js dshHomePath('lab-agent/vendor/nature-skills')
        lockFile: !!js dshHomePath('lab-agent/vendor.lock.json')

    # ── Python environment service ────────────────────────────────────────────
    #
    # Host service `ctx.labPython`: preflight + bootstrap of the pinned Python
    # venv used by nature skills' scripts. No auto-install at boot — only
    # explicit preflight/bootstrap calls (install script, regression runner,
    # later task interfaces).
    - id: lab-python-env
      name: 'dsh-lab-agent/python-env'
      config:
        venvDir: !!js dshHomePath('lab-agent/.venv')
        lockFile: !!js dshHomePath('lab-agent/requirements.lock')

    # ── Reading goal profiles (ReadingGoalProfile) ────────────────────────────
    #
    # Host service `ctx.labGoals`: 可保存/复制/修改/版本化的精读目标。版本行
    # 不可变（id@version），任务引用版本快照；删除只归档，历史与快照始终
    # 可读。内置聚前药默认目标幂等种子。Phase 3 的任务接口在这里取配置并
    # 转换为 nature-paper-card 重点审查要求。
    - id: lab-goal-profiles
      name: 'dsh-lab-agent/goal-profiles'
      inject: [storageDomain]

    # ── PPT template profiles (PptTemplateProfile) ────────────────────────────
    #
    # Host service `ctx.labTemplates`: PPTX 导入（解析母版/布局/占位符/字体/
    # 主题色/页面比例）→ 自动版式角色映射建议 → 预览 → 用户确认 → 验证发布。
    # 映射无效时 validate() 明确失败，不静默替换为默认模板。源文件与解析结果
    # 存 $DSH_HOME/lab-agent/templates/<id>/v<version>/。
    - id: lab-ppt-templates
      name: 'dsh-lab-agent/ppt-templates'
      inject: [storageDomain]
      config:
        templatesDir: !!js dshHomePath('lab-agent/templates')
