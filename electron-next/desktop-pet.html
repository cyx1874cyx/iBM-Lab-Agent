<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>iBM 科研桌面宠物</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#16392e;font:12px 'Microsoft YaHei',sans-serif;user-select:none;padding:12px}.pet{display:flex;gap:10px;align-items:center;-webkit-app-region:drag;min-height:94px}.portrait{position:relative;flex-shrink:0;width:78px;height:78px;border-radius:50%;box-shadow:0 4px 18px #154c3330;background:#e0f3e8;animation:breathe 4s ease-in-out infinite}.portrait img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #ffffff}.badge{position:absolute;right:-1px;bottom:0;background:#238656;color:white;border:2px solid white;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:14px}.bubble{width:188px;padding:12px;background:#fffffff5;border-radius:16px;box-shadow:0 4px 20px #123e2925;border:1px solid #d9eadd;position:relative}.tools{display:flex;gap:8px;position:absolute;right:8px;top:5px}button{border:0;background:none;color:#658577;cursor:pointer;padding:0 2px;-webkit-app-region:no-drag}.label{font-weight:bold;margin:4px 26px 7px 0;font-size:12px}.stage{font-size:12px;line-height:1.5}.detail{color:#61796d;font-size:10px;margin-top:5px}.track{height:4px;border-radius:8px;overflow:hidden;background:#e2eee6;margin-top:8px}.fill{height:100%;background:#2a9360;width:0;transition:width .3s}.busy .fill.unknown{width:35%;animation:travel 1.4s infinite}.busy .portrait{animation:working 1.5s ease-in-out infinite}.done .portrait{animation:cheer 1s ease-in-out 2}.error .badge{background:#cc5656}.waiting .badge{background:#cc9a32}.queue{margin:8px 0 0 86px;max-height:90px;overflow:auto;border-radius:10px;background:#ffffffed;padding:6px 9px;font-size:10px;color:#5f786a;-webkit-app-region:no-drag}.queue:empty{display:none}.queue div{padding:3px 0}.foot{font-size:10px;color:#739281;margin-top:6px}.idle .track{display:none}@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes working{50%{transform:translateY(-6px) rotate(3deg)}}@keyframes cheer{50%{transform:translateY(-9px) rotate(-7deg)}}@keyframes travel{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main id="pet" class="idle"><div class="pet"><div class="portrait"><img id="portrait" alt="iBM 人像宠物"><span id="badge" class="badge">·</span></div><div class="bubble"><div class="tools"><button id="main" title="打开主界面">↗</button><button id="hide" title="隐藏宠物，可在 iBM 插件设置中恢复">×</button></div><div id="label" class="label">iBM 科研助手</div><div id="stage" class="stage">正在连接任务状态…</div><div id="detail" class="detail"></div><div class="track"><div id="fill" class="fill"></div></div><div id="foot" class="foot">拖动头像调整位置</div></div></div><div id="queue" class="queue"></div></main><script src="desktop-pet-renderer.js"></script></body></html>
