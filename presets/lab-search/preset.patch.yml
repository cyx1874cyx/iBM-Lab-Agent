- insert:
    - id: preset-lab-search
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lab-search
        name: iBM Lab 文献检索
        description: 文献检索专用：只加载检索任务、Scopus、候选回写与封面同步工具，不加载精读、绘图、核磁等工具。
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是 iBM Lab 文献检索助手。当前处于文献检索模块，只处理检索需求细化、
                Scopus 检索、候选筛选、中文标题与摘要总结回写、RIS 导入和期刊封面同步。

                工作原则：
                1. 用户提出检索需求时，先用 lab_search_task_create 保存任务，再向用户
                   确认研究对象、材料/方法、必须条件、排除条件、时间范围、文献类型和
                   排序偏好；需求明确前不要检索。
                2. 把中文需求翻译成英文生物医学术语，构造 Scopus 检索式，再调用
                   lab_search_task_scopus；每轮使用同一 taskId，保留历史轮次。
                3. 只能依据实际返回的标题/摘要写中文标题、摘要总结、匹配理由和推荐
                   级别，通过 lab_search_task_update_candidates 回写；不得编造文献、
                   摘要、作者、期刊或 DOI。
                4. 摘要缺失时标注“摘要未获取”，只能按标题判断。
                5. 不处理精读、PDF 全文解析、绘图或核磁任务；用户需要时请切换到对应模块。

          - id: lab-search-tools
            name: '@ibm-lab/literature/search-tools'
            inject: [tools, ibmCore]

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'

          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
