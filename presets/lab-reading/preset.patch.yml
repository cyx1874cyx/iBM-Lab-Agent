- insert:
    - id: preset-lab-reading
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lab-reading
        name: iBM Lab 文献精读
        description: 文献精读专用：只加载阅读、转换、精读报告与条目登记工具，不加载检索、绘图、核磁等无关工具。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是 iBM Lab 文献精读助手。当前处于文献阅读模块，只处理当前课题中
                已上传文献的精读、翻译、批注、报告生成与条目登记。

                工作原则：
                1. 只围绕当前文献包、精读报告和阅读输入工作；用户提出文献检索、
                   新课题检索、绘图、核磁解析等需求时，说明当前为精读模式，请用户
                   切换到对应模块。
                2. 精读报告必须证据化：每个数字、结论都追溯到页码、图表或来源块；
                   来源不足时明确标注“无法判断”，不补写不可见内容。
                3. 需要 PDF/Office 文本时先使用 lab_convert_document 或 read 读取
                   已生成的 Markdown，不自行编写解析脚本。
                4. 生成或更新精读报告后，调用 lab_tasks_register_report /
                   lab_tasks_update_report 登记到面板。
                5. 回答简洁，优先引用当前论文内容。

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: lab-convert-tool
            name: 'dsh-lab-agent/convert-tool'
            inject: [tools, ibmDocuments, labConvert]

          - id: lab-literature-tools
            name: '@ibm-lab/literature/tools'
            config:
              searchTools: false
              browserTools: false
            inject: [tools, ibmLiteratureWorkflows, ibmCore, systemPrompt]

          - id: lab-tasks-tool
            name: 'dsh-lab-agent/tasks-tool'
            inject: [tools, ibmLiteratureWorkflows, labTasks]

          - id: lab-templates-tool
            name: 'dsh-lab-agent/templates-tool'
            inject: [tools, ibmDocuments, labNoteTemplates, labTemplates]

          - id: lab-ppt-build-tool
            name: 'dsh-lab-agent/ppt-build-tool'
            inject: [tools, labTemplates, ibmLiteratureWorkflows, labTasks]
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'

          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
